name: Windows build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: win-x64
            platform: x64
          - runtime: win-arm64
            platform: ARM64

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore src/AntiAway/AntiAway.csproj -p:Platform=${{ matrix.platform }} -r ${{ matrix.runtime }}

      - name: Build
        run: dotnet build src/AntiAway/AntiAway.csproj --configuration Release --no-restore -p:Platform=${{ matrix.platform }} -r ${{ matrix.runtime }}

      - name: Ensure Inno Setup is available
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }

      - name: Build installer
        shell: pwsh
        run: ./scripts/Build-Installer.ps1 -Version 0.1.0 -RuntimeIdentifier ${{ matrix.runtime }}

      - name: Upload installer
        uses: actions/upload-artifact@v5
        with:
          name: AntiAway-${{ matrix.runtime }}-installer
          path: artifacts/installer/*.exe
          if-no-files-found: error
